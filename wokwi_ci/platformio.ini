; Projeto PlatformIO usado só para compilar os sketches gerados pelo
; generate_samples_v2.py em um firmware .elf/.bin que o wokwi-cli consegue simular.
; src/main.ino é sobrescrito a cada lote pelo script run_wokwi_batches.py.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
